<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bowyer-Watson 逐点插入演示</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#f3f5f8; color:#182230; font-family:"Microsoft YaHei",sans-serif; }
    main { width:min(1100px,96vw); margin:20px auto; background:#fff; border:1px solid #d8dee8; border-radius:12px; padding:18px; }
    h1 { margin:0 0 6px; font-size:22px; }
    .hint { margin:0 0 14px; color:#5c6777; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    button { padding:9px 13px; border:1px solid #b9c2cf; border-radius:7px; background:#fff; cursor:pointer; font-size:14px; }
    button:hover:not(:disabled) { background:#edf4ff; border-color:#6393d7; }
    button:disabled { opacity:.42; cursor:not-allowed; }
    #nextButton { background:#2768c7; color:#fff; border-color:#2768c7; }
    .stagebar { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:10px; }
    .stage { padding:7px 4px; text-align:center; border-radius:5px; background:#edf0f4; color:#657082; font-size:13px; }
    .stage.active { background:#dceaff; color:#174f9e; font-weight:600; }
    canvas { width:100%; height:min(620px,62vh); display:block; border:1px solid #d8dee8; border-radius:8px; background:linear-gradient(#fcfdff,#edf1f6); cursor:grab; }
    canvas:active { cursor:grabbing; }
    .bottom { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:10px; }
    #status { color:#35465e; min-height:44px; flex:1; }
    .legend { display:flex; flex-wrap:wrap; gap:14px; font-size:13px; }
    .legend span::before { content:""; display:inline-block; width:17px; height:3px; margin-right:6px; vertical-align:middle; background:var(--c); }
    @media(max-width:650px) { .stagebar { grid-template-columns:1fr; } canvas { height:460px; } }
  </style>
</head>
<body>
<main>
  <h1>Bowyer-Watson：逐点生成四面体网格</h1>
  <p class="hint">先观察几何体怎样变成离散点，再反复点击蓝色按钮。按住画面拖动可以旋转。</p>

  <div class="controls">
    <button id="shapeButton">1　生成复杂几何体</button>
    <button id="surfaceButton" disabled>2　拆解出表面点集</button>
    <button id="interiorButton" disabled>3　生成内部候选点</button>
    <button id="boxButton" disabled>4　生成包围盒</button>
    <button id="superButton" disabled>5　生成超级四面体</button>
    <button id="nextButton" disabled>开始插入第一个点</button>
  </div>

  <div class="stagebar">
    <div class="stage" data-stage="select">① 选择新点 p</div>
    <div class="stage" data-stage="bad">② 寻找坏四面体</div>
    <div class="stage" data-stage="delete">③ 删除旧四面体</div>
    <div class="stage" data-stage="cavity">④ 找到空腔边界</div>
    <div class="stage" data-stage="connect">⑤ p 连接边界</div>
  </div>

  <canvas id="view"></canvas>
  <div class="bottom">
    <div id="status">请先生成复杂几何体。</div>
    <div class="legend">
      <span style="--c:#4f83cc">几何表面</span>
      <span style="--c:#65748a">表面点</span>
      <span style="--c:#9a45bd">内部候选点</span>
      <span style="--c:#2768c7">当前网格</span>
      <span style="--c:#d83f58">坏四面体</span>
      <span style="--c:#e58a19">空腔边界</span>
      <span style="--c:#1f9b68">新四面体</span>
    </div>
  </div>
</main>

<script>
const canvas=document.getElementById('view'), ctx=canvas.getContext('2d');
const shapeButton=document.getElementById('shapeButton');
const surfaceButton=document.getElementById('surfaceButton');
const interiorButton=document.getElementById('interiorButton');
const boxButton=document.getElementById('boxButton');
const superButton=document.getElementById('superButton');
const nextButton=document.getElementById('nextButton');
const status=document.getElementById('status');
const stages=[...document.querySelectorAll('.stage')];

let surfacePoints=[], interiorPoints=[], surfaceFaces=[], input=[], box=[], superPoints=[], meshPoints=[], tetrahedra=[];
let bad=[], cavity=[], newTets=[], inserted=0, current=-1, phase='setup';
let showGeometry=false, showSurface=false, showInterior=false, showBox=false, showSuper=false;
let angleX=-0.35, angleY=0.55, dragging=false, lastX=0, lastY=0;

// 第一步：显示一个不规则封闭几何体。
// 在真实程序中，这些面来自 STEP 文件里的曲面和拓扑。
function makeInput(){
  surfacePoints=[
    {x:-1.35,y:-.55,z:-.35},{x:1.25,y:-.65,z:-.25},{x:1.05,y:.85,z:-.45},{x:-1.15,y:.95,z:-.2},
    {x:-.85,y:-.45,z:1.05},{x:.9,y:-.35,z:1.25},{x:.65,y:.8,z:.85},{x:-.7,y:.65,z:1.3}
  ];
  interiorPoints=[
    {x:0,y:0,z:.25},{x:.25,y:-.1,z:.7},{x:-.3,y:.25,z:.55},{x:.15,y:.45,z:-.05}
  ];
  surfaceFaces=[
    [0,2,1],[0,3,2],[4,5,6],[4,6,7],
    [0,1,5],[0,5,4],[1,2,6],[1,6,5],
    [2,3,7],[2,7,6],[3,0,4],[3,4,7]
  ];
  input=[];
  box=[]; superPoints=[]; meshPoints=[]; tetrahedra=[]; bad=[]; cavity=[]; newTets=[];
  inserted=0; current=-1; phase='setup';
  showGeometry=true; showSurface=false; showInterior=false; showBox=false; showSuper=false;
  surfaceButton.disabled=false; interiorButton.disabled=true; boxButton.disabled=true;
  superButton.disabled=true; nextButton.disabled=true;
  nextButton.textContent='开始插入第一个点';
  setStage('');
  status.textContent='蓝色面片代表 STEP 曲面组成的封闭几何外形，此时还没有体网格节点。';
  draw();
}

// 第二步：把连续曲面离散成表面节点。
function extractSurface(){
  input=surfacePoints.map(p=>({...p}));
  showSurface=true;
  interiorButton.disabled=false;
  status.textContent=`曲面已离散为 ${surfacePoints.length} 个灰色表面点，它们全部位于几何边界上。`;
  draw();
}

// 第三步：在实体内部补充候选点。
function makeInterior(){
  input=[...surfacePoints.map(p=>({...p})),...interiorPoints.map(p=>({...p}))];
  showInterior=true;
  boxButton.disabled=false;
  status.textContent=`加入 ${interiorPoints.length} 个紫色内部候选点，后面会同时插入表面点和内部点。`;
  draw();
}

function makeBox(){
  let min={...input[0]}, max={...input[0]};
  for(const p of input){
    min.x=Math.min(min.x,p.x); min.y=Math.min(min.y,p.y); min.z=Math.min(min.z,p.z);
    max.x=Math.max(max.x,p.x); max.y=Math.max(max.y,p.y); max.z=Math.max(max.z,p.z);
  }
  box=[
    {x:min.x,y:min.y,z:min.z},{x:max.x,y:min.y,z:min.z},{x:max.x,y:max.y,z:min.z},{x:min.x,y:max.y,z:min.z},
    {x:min.x,y:min.y,z:max.z},{x:max.x,y:min.y,z:max.z},{x:max.x,y:max.y,z:max.z},{x:min.x,y:max.y,z:max.z}
  ];
  showBox=true; superButton.disabled=false;
  status.textContent='包围盒由 x、y、z 三个方向的最小值和最大值组成。';
  draw();
}

function makeSuper(){
  const min=box[0], max=box[6];
  const c={x:(min.x+max.x)/2,y:(min.y+max.y)/2,z:(min.z+max.z)/2};
  const size=Math.max(max.x-min.x,max.y-min.y,max.z-min.z), s=size*2;
  superPoints=[
    {x:c.x+s,y:c.y+s,z:c.z+s},{x:c.x-s,y:c.y-s,z:c.z+s},
    {x:c.x-s,y:c.y+s,z:c.z-s},{x:c.x+s,y:c.y-s,z:c.z-s}
  ];
  meshPoints=superPoints.map(p=>({...p}));
  tetrahedra=[[0,1,2,3]];
  showSuper=true; nextButton.disabled=false; phase='ready';
  status.textContent='超级四面体是初始网格。现在可以逐个插入灰色输入点。';
  draw();
}

function orient(a,b,c,d){
  const ab=sub(b,a), ac=sub(c,a), ad=sub(d,a);
  return dot(cross(ab,ac),ad);
}
function inSphere(a,b,c,d,e){
  const A=sub(a,e),B=sub(b,e),C=sub(c,e),D=sub(d,e);
  const a2=dot(A,A),b2=dot(B,B),c2=dot(C,C),d2=dot(D,D);
  const det3=(a,b,c,d,e,f,g,h,i)=>a*(e*i-f*h)-b*(d*i-f*g)+c*(d*h-e*g);
  const det=A.x*det3(B.y,B.z,b2,C.y,C.z,c2,D.y,D.z,d2)
    -A.y*det3(B.x,B.z,b2,C.x,C.z,c2,D.x,D.z,d2)
    +A.z*det3(B.x,B.y,b2,C.x,C.y,c2,D.x,D.y,d2)
    -a2*det3(B.x,B.y,B.z,C.x,C.y,C.z,D.x,D.y,D.z);
  return -det;
}
function sub(a,b){return{x:a.x-b.x,y:a.y-b.y,z:a.z-b.z};}
function dot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z;}
function cross(a,b){return{x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x};}

function boundaryOf(badTets){
  const map=new Map();
  for(const ti of badTets){
    const t=tetrahedra[ti];
    const faces=[[t[1],t[2],t[3]],[t[0],t[3],t[2]],[t[0],t[1],t[3]],[t[0],t[2],t[1]]];
    for(const face of faces){
      const key=[...face].sort((a,b)=>a-b).join('-');
      if(map.has(key)) map.get(key).count++; else map.set(key,{face,count:1});
    }
  }
  return [...map.values()].filter(item=>item.count===1).map(item=>item.face);
}

function advance(){
  if(phase==='ready'){
    if(inserted>=input.length){ finish(); return; }
    meshPoints.push({...input[inserted]}); current=meshPoints.length-1; phase='select';
    setStage('select'); nextButton.textContent='下一步：寻找坏四面体';
    status.textContent=`选择第 ${inserted+1} 个点 p。接下来检查它落入哪些外接球。`;
  } else if(phase==='select'){
    bad=[];
    tetrahedra.forEach((t,i)=>{
      const value=inSphere(meshPoints[t[0]],meshPoints[t[1]],meshPoints[t[2]],meshPoints[t[3]],meshPoints[current]);
      if(value>1e-9) bad.push(i);
    });
    cavity=boundaryOf(bad); phase='bad'; setStage('bad'); nextButton.textContent='下一步：删除旧四面体';
    status.textContent=`找到 ${bad.length} 个坏四面体：新点位于它们的外接球内部。`;
  } else if(phase==='bad'){
    phase='delete'; setStage('delete'); nextButton.textContent='下一步：显示空腔边界';
    status.textContent='坏四面体已从画面中删除，中间留下一个空区域。';
  } else if(phase==='delete'){
    phase='cavity'; setStage('cavity'); nextButton.textContent='下一步：连接空腔边界';
    status.textContent=`橙色三角面是空腔边界，共 ${cavity.length} 个；内部重复面已经被消去。`;
  } else if(phase==='cavity'){
    const badSet=new Set(bad);
    tetrahedra=tetrahedra.filter((_,i)=>!badSet.has(i));
    newTets=cavity.map(face=>{
      const t=[face[0],face[1],face[2],current];
      if(orient(meshPoints[t[0]],meshPoints[t[1]],meshPoints[t[2]],meshPoints[t[3]])<0) [t[0],t[1]]=[t[1],t[0]];
      return t;
    });
    tetrahedra.push(...newTets); phase='connect'; setStage('connect'); nextButton.textContent='完成本次插入';
    status.textContent=`点 p 与每个空腔边界面连接，生成 ${newTets.length} 个绿色新四面体。`;
  } else if(phase==='connect'){
    inserted++; bad=[]; cavity=[]; newTets=[]; current=-1; phase='ready'; setStage('');
    nextButton.textContent=inserted<input.length?'插入下一个点':'删除超级四面体相关单元';
    status.textContent=`第 ${inserted} 个点插入完成。当前网格共有 ${tetrahedra.length} 个四面体。`;
  }
  draw();
}

function finish(){
  tetrahedra=tetrahedra.filter(t=>t.every(index=>index>=4));
  phase='finished'; showSuper=false; nextButton.disabled=true; setStage('');
  status.textContent=`全部点插入完成，并删除了连接超级四面体顶点的单元。最终得到 ${tetrahedra.length} 个四面体。`;
  draw();
}

function setStage(name){ stages.forEach(el=>el.classList.toggle('active',el.dataset.stage===name)); }
function rotate(p){
  const cy=Math.cos(angleY),sy=Math.sin(angleY),cx=Math.cos(angleX),sx=Math.sin(angleX);
  const x=p.x*cy+p.z*sy, z=-p.x*sy+p.z*cy;
  return{x,y:p.y*cx-z*sx,z:p.y*sx+z*cx};
}
function project(p){
  const r=rotate(p), scale=Math.min(canvas.clientWidth,canvas.clientHeight)/(showSuper?12:4.5);
  return{x:canvas.clientWidth/2+r.x*scale,y:canvas.clientHeight/2-r.y*scale,z:r.z};
}
function edge(a,b,color,width=1.4){
  const p=project(meshPoints[a]),q=project(meshPoints[b]);
  ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
}
function drawTet(t,color,width=1.3){
  [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]].forEach(e=>edge(t[e[0]],t[e[1]],color,width));
}
function drawFace(face,color){
  const p=face.map(i=>project(meshPoints[i]));
  ctx.fillStyle=color;ctx.strokeStyle='#d77708';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);ctx.lineTo(p[1].x,p[1].y);ctx.lineTo(p[2].x,p[2].y);ctx.closePath();ctx.fill();ctx.stroke();
}
function dotMark(p,color,r,label=''){
  const q=project(p);ctx.fillStyle=color;ctx.beginPath();ctx.arc(q.x,q.y,r,0,Math.PI*2);ctx.fill();
  if(label){ctx.fillStyle='#182230';ctx.font='14px Microsoft YaHei';ctx.fillText(label,q.x+8,q.y-8);}
}
function draw(){
  ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
  if(!surfacePoints.length)return;

  // 几何体先以连续表面的形式出现。开始插点后将表面淡化，便于观察内部网格。
  if(showGeometry){
    const ordered=surfaceFaces.map(face=>({
      face,
      depth:face.reduce((sum,i)=>sum+rotate(surfacePoints[i]).z,0)/3
    })).sort((a,b)=>a.depth-b.depth);
    for(const item of ordered){
      const p=item.face.map(i=>project(surfacePoints[i]));
      ctx.fillStyle=meshPoints.length?'rgba(79,131,204,.06)':'rgba(79,131,204,.30)';
      ctx.strokeStyle=meshPoints.length?'rgba(55,91,142,.13)':'rgba(55,91,142,.55)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);ctx.lineTo(p[1].x,p[1].y);ctx.lineTo(p[2].x,p[2].y);ctx.closePath();ctx.fill();ctx.stroke();
    }
  }

  if(showSurface){
    surfacePoints.forEach((p,i)=>{
      if(i>=inserted && !(current>=0&&i===inserted)) dotMark(p,'#65748a',5);
    });
  }
  if(showInterior){
    interiorPoints.forEach((p,j)=>{
      const i=surfacePoints.length+j;
      if(i>=inserted && !(current>=0&&i===inserted)) dotMark(p,'#9a45bd',5);
    });
  }
  if(showBox){
    const old=meshPoints; meshPoints=box;
    [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]].forEach(e=>edge(e[0],e[1],'#e58a19',1.8));
    meshPoints=old;
  }
  if(tetrahedra.length){
    const badSet=new Set(bad);
    tetrahedra.forEach((t,i)=>{
      if((phase==='delete'||phase==='cavity')&&badSet.has(i))return;
      if(phase==='bad'&&badSet.has(i))drawTet(t,'#d83f58',3);
      else if(phase==='connect'&&newTets.includes(t))drawTet(t,'#1f9b68',2.6);
      else drawTet(t,'rgba(39,104,199,.55)',1.25);
    });
  }
  if(phase==='cavity') cavity.forEach(face=>drawFace(face,'rgba(229,138,25,.35)'));
  if(current>=0)dotMark(meshPoints[current],'#b21fcd',7,'p');
  if(showSuper) superPoints.forEach((p,i)=>dotMark(p,'#d83f58',5,'S'+i));
}

shapeButton.onclick=makeInput;
surfaceButton.onclick=extractSurface;
interiorButton.onclick=makeInterior;
boxButton.onclick=makeBox;
superButton.onclick=makeSuper;
nextButton.onclick=advance;
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;angleY+=(e.clientX-lastX)*.01;angleX+=(e.clientY-lastY)*.01;lastX=e.clientX;lastY=e.clientY;draw();});
canvas.addEventListener('pointerup',()=>dragging=false);
function resize(){const r=window.devicePixelRatio||1,box=canvas.getBoundingClientRect();canvas.width=box.width*r;canvas.height=box.height*r;ctx.setTransform(r,0,0,r,0,0);draw();}
window.addEventListener('resize',resize);resize();
</script>
</body>
</html>
