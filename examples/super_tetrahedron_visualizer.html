<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超级四面体演示</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f5f8;
      color: #1f2937;
      font-family: "Microsoft YaHei", sans-serif;
    }
    main {
      width: min(1000px, 94vw);
      background: white;
      border: 1px solid #d8dee8;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 12px 35px rgba(31, 41, 55, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 16px; color: #5b6574; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    button {
      border: 1px solid #b7c1cf;
      border-radius: 7px;
      padding: 9px 14px;
      background: #fff;
      color: #1f2937;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #eef4ff; border-color: #6d9ee8; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    canvas {
      width: 100%;
      height: min(620px, 65vh);
      display: block;
      background: linear-gradient(#fbfcfe, #eef2f7);
      border: 1px solid #d8dee8;
      border-radius: 8px;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: 14px; }
    .legend span::before {
      content: "";
      display: inline-block;
      width: 20px;
      height: 3px;
      margin-right: 7px;
      vertical-align: middle;
      background: var(--color);
    }
    #status { margin-top: 10px; color: #40516a; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>复杂多面体、包围盒与超级四面体</h1>
  <p>依次点击三个按钮。按住鼠标拖动可以旋转观察。</p>

  <div class="controls">
    <button id="shapeButton">1　生成复杂多面体</button>
    <button id="boxButton" disabled>2　生成包围盒</button>
    <button id="tetraButton" disabled>3　生成超级四面体</button>
  </div>

  <canvas id="view"></canvas>

  <div class="legend">
    <span style="--color:#4f83cc">复杂多面体</span>
    <span style="--color:#e28a24">包围盒</span>
    <span style="--color:#d1485f">超级四面体</span>
  </div>
  <div id="status">请先生成复杂多面体。</div>
</main>

<script>
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const shapeButton = document.getElementById("shapeButton");
const boxButton = document.getElementById("boxButton");
const tetraButton = document.getElementById("tetraButton");
const status = document.getElementById("status");

let vertices = [];
let triangles = [];
let boxVertices = [];
let tetraVertices = [];
let showBox = false;
let showTetra = false;
let angleX = -0.35;
let angleY = 0.6;
let dragging = false;
let lastX = 0;
let lastY = 0;

function resizeCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.round(rect.width * ratio);
  canvas.height = Math.round(rect.height * ratio);
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  draw();
}

function generatePolyhedron() {
  vertices = [];
  triangles = [];
  const rings = 7;
  const segments = 12;

  // 用多圈不规则顶点组成一个带凹凸表面的封闭多面体。
  vertices.push({x: 0, y: 0, z: 1.55});
  for (let ring = 1; ring < rings; ring++) {
    const phi = Math.PI * ring / rings;
    for (let segment = 0; segment < segments; segment++) {
      const theta = Math.PI * 2 * segment / segments;
      const wave = 1 + 0.22 * Math.sin(theta * 3 + ring) + 0.12 * Math.cos(theta * 5 - ring);
      vertices.push({
        x: 1.35 * wave * Math.sin(phi) * Math.cos(theta),
        y: 1.00 * wave * Math.sin(phi) * Math.sin(theta),
        z: 1.45 * Math.cos(phi) * (1 + 0.08 * Math.sin(theta * 2))
      });
    }
  }
  const bottom = vertices.length;
  vertices.push({x: 0, y: 0, z: -1.55});

  for (let s = 0; s < segments; s++) {
    triangles.push([0, 1 + s, 1 + (s + 1) % segments]);
  }
  for (let ring = 0; ring < rings - 2; ring++) {
    const first = 1 + ring * segments;
    const next = first + segments;
    for (let s = 0; s < segments; s++) {
      const n = (s + 1) % segments;
      triangles.push([first + s, next + s, next + n]);
      triangles.push([first + s, next + n, first + n]);
    }
  }
  const lastRing = 1 + (rings - 2) * segments;
  for (let s = 0; s < segments; s++) {
    triangles.push([lastRing + s, bottom, lastRing + (s + 1) % segments]);
  }

  showBox = false;
  showTetra = false;
  boxButton.disabled = false;
  tetraButton.disabled = true;
  status.textContent = `已生成复杂多面体：${vertices.length} 个顶点，${triangles.length} 个三角面。`;
  draw();
}

function generateBoundingBox() {
  const xs = vertices.map(p => p.x);
  const ys = vertices.map(p => p.y);
  const zs = vertices.map(p => p.z);
  const min = {x: Math.min(...xs), y: Math.min(...ys), z: Math.min(...zs)};
  const max = {x: Math.max(...xs), y: Math.max(...ys), z: Math.max(...zs)};

  boxVertices = [
    {x:min.x,y:min.y,z:min.z}, {x:max.x,y:min.y,z:min.z},
    {x:max.x,y:max.y,z:min.z}, {x:min.x,y:max.y,z:min.z},
    {x:min.x,y:min.y,z:max.z}, {x:max.x,y:min.y,z:max.z},
    {x:max.x,y:max.y,z:max.z}, {x:min.x,y:max.y,z:max.z}
  ];
  showBox = true;
  showTetra = false;
  tetraButton.disabled = false;
  status.textContent = "已找到 x、y、z 三个方向的最小值和最大值，并生成包围盒。";
  draw();
}

function generateSuperTetrahedron() {
  const min = boxVertices[0];
  const max = boxVertices[6];
  const center = {
    x: (min.x + max.x) / 2,
    y: (min.y + max.y) / 2,
    z: (min.z + max.z) / 2
  };
  const size = Math.max(max.x - min.x, max.y - min.y, max.z - min.z);
  const scale = size * 4;

  tetraVertices = [
    {x:center.x+scale, y:center.y+scale, z:center.z+scale},
    {x:center.x-scale, y:center.y-scale, z:center.z+scale},
    {x:center.x-scale, y:center.y+scale, z:center.z-scale},
    {x:center.x+scale, y:center.y-scale, z:center.z-scale}
  ];
  showTetra = true;
  status.textContent = "已在包围盒外创建四个临时顶点。超级四面体包住了包围盒和多面体。";
  draw();
}

function rotate(p) {
  const cy = Math.cos(angleY), sy = Math.sin(angleY);
  const cx = Math.cos(angleX), sx = Math.sin(angleX);
  const x1 = p.x * cy + p.z * sy;
  const z1 = -p.x * sy + p.z * cy;
  return {x: x1, y: p.y * cx - z1 * sx, z: p.y * sx + z1 * cx};
}

function project(p, scale) {
  const rotated = rotate(p);
  return {
    x: canvas.clientWidth / 2 + rotated.x * scale,
    y: canvas.clientHeight / 2 - rotated.y * scale,
    z: rotated.z
  };
}

function drawEdges(points, edges, color, width, scale) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  for (const [a, b] of edges) {
    const p = project(points[a], scale);
    const q = project(points[b], scale);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(q.x, q.y);
    ctx.stroke();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  if (vertices.length === 0) return;

  // 超级四面体很大，所以显示它时自动缩小整个场景。
  const sceneScale = showTetra ? canvas.clientHeight / 26 : canvas.clientHeight / 5.2;

  const sortedTriangles = triangles.map(face => ({
    face,
    depth: face.reduce((sum, index) => sum + rotate(vertices[index]).z, 0) / 3
  })).sort((a, b) => a.depth - b.depth);

  for (const item of sortedTriangles) {
    const points = item.face.map(index => project(vertices[index], sceneScale));
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    ctx.lineTo(points[1].x, points[1].y);
    ctx.lineTo(points[2].x, points[2].y);
    ctx.closePath();
    ctx.fillStyle = "rgba(79, 131, 204, 0.34)";
    ctx.strokeStyle = "rgba(55, 91, 142, 0.45)";
    ctx.lineWidth = 0.8;
    ctx.fill();
    ctx.stroke();
  }

  if (showBox) {
    drawEdges(boxVertices,
      [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]],
      "#e28a24", 2.2, sceneScale);
  }

  if (showTetra) {
    drawEdges(tetraVertices,
      [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]],
      "#d1485f", 2.8, sceneScale);
  }
}

shapeButton.addEventListener("click", generatePolyhedron);
boxButton.addEventListener("click", generateBoundingBox);
tetraButton.addEventListener("click", generateSuperTetrahedron);

canvas.addEventListener("pointerdown", event => {
  dragging = true;
  lastX = event.clientX;
  lastY = event.clientY;
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", event => {
  if (!dragging) return;
  angleY += (event.clientX - lastX) * 0.01;
  angleX += (event.clientY - lastY) * 0.01;
  lastX = event.clientX;
  lastY = event.clientY;
  draw();
});
canvas.addEventListener("pointerup", () => dragging = false);
window.addEventListener("resize", resizeCanvas);

resizeCanvas();
</script>
</body>
</html>
